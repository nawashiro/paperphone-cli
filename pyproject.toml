[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paperphone"
version = "0.1.0"
description = "Print today's booklet as an A4 landscape PDF"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "weasyprint>=62",
    "pillow>=10",
    "httpx>=0.27",
    "tomlkit>=0.12",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
paperphone = "paperphone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperphone = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["paperphone"]
