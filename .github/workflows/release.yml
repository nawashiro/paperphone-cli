name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Build release tarball
        run: |
          tar --exclude=.git --exclude=.venv --exclude=dist \
            -czf "paperphone-${GITHUB_REF_NAME}.tar.gz" .
          cp "paperphone-${GITHUB_REF_NAME}.tar.gz" paperphone.tar.gz
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            paperphone-${{ github.ref_name }}.tar.gz
            paperphone.tar.gz
