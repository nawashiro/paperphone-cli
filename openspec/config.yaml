schema: spec-driven

context: |
  Language: japanese
  All artifacts must be written in japanese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Paper Phone is a Linux CLI that prints today's personal booklet as an
  A4-landscape PDF. The booklet has eight fixed panels (contacts, calendar,
  tasks, photo, notes, cover, weather, paper app) and an optional rotated map
  page. The user selects panels and sources in a TOML config, then runs
  `paperphone` from cron or a systemd user timer.

  - Python 3.12+, single package `src/paperphone/`, entry point `paperphone`
  - Depends on the system PyGObject plus EDS typelibs (ECal, EBook,
    EDataServer, ICalGLib), so the venv uses `--system-site-packages`
  - WeasyPrint renders HTML/CSS; pypdf rotates the map page; Pillow handles
    photos, map tiles, and grayscale
  - Calendar, contacts, and VTODO tasks come from EDS sources: GNOME Online
    Accounts ones are read-only, and `paperphone dav add` creates managed
    CalDAV/CardDAV sources with credentials in the login keyring
  - Weather comes from Open-Meteo; maps from OSM raster tiles plus an
    optional Valhalla walking route. Both must degrade to a partial booklet
  - Tests use fixtures and mocks: `.venv/bin/pytest`
  - Lint: `.venv/bin/ruff check src tests`
  - Build: `.venv/bin/python -m build`
  - This development machine has no GNOME desktop or EDS. Doctor, source
    registration, keyring, and systemd user timer runs are verified in a
    rootless Podman GNOME/EDS container (docs/gnome-container.md); physical
    double-sided printing and folding remain a manual check
